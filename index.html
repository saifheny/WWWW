<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
<title>NeoFlow | الشرارة</title>

<!-- PWA Setup -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">

<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

<style>
  :root {
    --bg-main: #000000;
    --bg-card: #121212;
    --bg-elevated: #1e1e1e;
    --accent-primary: #00f2ea;
    --accent-secondary: #ff0050;
    --text-main: #ffffff;
    --text-muted: #888888;
    --nav-height: 80px;
    --safe-area-bottom: env(safe-area-inset-bottom, 20px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; user-select: none; }
  input, textarea { user-select: text; }

  body {
    margin: 0; padding: 0;
    background-color: var(--bg-main);
    font-family: 'Cairo', sans-serif;
    color: var(--text-main);
    overflow-x: hidden;
    padding-bottom: calc(var(--nav-height) + 40px);
  }

  /* --- Login Screen --- */
  #login-screen {
    position: fixed; inset: 0; z-index: 2000;
    background: #000;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 20px;
  }
  .login-box {
    width: 100%; max-width: 350px;
    text-align: center;
  }
  .neon-title {
    font-size: 3rem; font-weight: 900; margin-bottom: 10px;
    background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .input-field {
    width: 100%; padding: 15px; margin-top: 20px;
    background: #1a1a1a; border: 1px solid #333; border-radius: 15px;
    color: #fff; font-size: 1.1rem; text-align: center; font-family: inherit;
  }
  .gender-select {
    display: flex; gap: 10px; margin: 20px 0;
  }
  .g-opt {
    flex: 1; padding: 12px; background: #1a1a1a; border-radius: 12px;
    cursor: pointer; transition: 0.2s; border: 1px solid transparent;
  }
  .g-opt.selected { background: #222; border-color: var(--accent-primary); color: var(--accent-primary); }
  
  .btn-main {
    width: 100%; padding: 15px; background: var(--accent-primary);
    border: none; border-radius: 15px; font-weight: 800; font-size: 1.1rem;
    color: #000; cursor: pointer; margin-top: 10px;
  }

  /* --- App Header --- */
  .app-header {
    position: sticky; top: 0; z-index: 100;
    padding: 15px 20px;
    background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid #222;
  }
  .user-badge {
    display: flex; align-items: center; gap: 10px;
    background: #1a1a1a; padding: 5px 12px 5px 5px; border-radius: 30px;
    cursor: pointer;
  }
  .user-badge img, .user-badge .avatar-ph {
    width: 30px; height: 30px; border-radius: 50%;
    background: #333; display: flex; justify-content: center; align-items: center; font-weight: bold;
  }
  .header-brand { font-size: 1.4rem; font-weight: 900; letter-spacing: 1px; }

  /* --- Feed & Cards --- */
  .feed { max-width: 600px; margin: 0 auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }

  .spark-card {
    background: var(--bg-card);
    border-radius: 20px;
    padding: 15px;
    position: relative;
    border: 1px solid #1f1f1f;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .card-top { display: flex; justify-content: space-between; margin-bottom: 10px; }
  .user-info { display: flex; gap: 10px; }
  .u-avatar {
    width: 45px; height: 45px; border-radius: 14px;
    background: #222; display: flex; justify-content: center; align-items: center;
    font-size: 1.2rem; font-weight: 800; color: var(--accent-primary);
  }
  .u-names h4 { margin: 0; font-size: 1rem; display: flex; align-items: center; gap: 5px; }
  .u-names span { font-size: 0.8rem; color: var(--text-muted); }
  
  .spark-text { font-size: 1.05rem; line-height: 1.5; color: #eee; margin-bottom: 15px; white-space: pre-wrap; }

  /* --- Actions Bar --- */
  .actions-bar {
    display: flex; justify-content: space-between;
    background: #000; padding: 8px 15px; border-radius: 12px;
  }
  .act-btn {
    background: none; border: none; color: #666; font-size: 1rem;
    display: flex; align-items: center; gap: 5px; cursor: pointer; padding: 5px;
    transition: 0.2s;
  }
  /* Vibe (Thunder) */
  .act-btn.vibe.active { color: #FFD700; filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.4)); }
  /* Boost (Retweet) */
  .act-btn.boost.active { color: #00ff88; }
  /* Echo (Comment) */
  .act-btn.echo:hover { color: var(--accent-primary); }

  /* --- Floating Navigation Dock --- */
  .dock-container {
    position: fixed; bottom: 20px; left: 0; right: 0;
    display: flex; justify-content: center; align-items: flex-end;
    pointer-events: none; /* Allows clicking through empty space */
    z-index: 900;
  }

  .nav-dock {
    pointer-events: auto;
    background: rgba(20,20,20,0.95);
    backdrop-filter: blur(20px);
    border: 1px solid #333;
    border-radius: 35px;
    height: 70px; width: 90%; max-width: 400px;
    display: flex; justify-content: space-around; align-items: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    position: relative;
  }

  .nav-item {
    font-size: 1.4rem; color: #666; background: none; border: none;
    padding: 10px; transition: 0.2s;
  }
  .nav-item.active { color: #fff; transform: translateY(-2px); }

  /* --- Floating Action Button (FAB) - Fixed Position --- */
  .fab-wrapper {
    position: absolute;
    bottom: 35px; /* رفع الزر للأعلى */
    left: 50%;
    transform: translateX(-50%);
    pointer-events: auto;
  }
  .create-btn {
    width: 65px; height: 65px;
    background: linear-gradient(135deg, var(--accent-primary), #00c2ff);
    border-radius: 50%; border: 4px solid #000; /* Border to separate from dock */
    display: flex; justify-content: center; align-items: center;
    font-size: 1.6rem; color: #000;
    box-shadow: 0 0 20px rgba(0, 242, 234, 0.3);
    cursor: pointer; transition: 0.2s;
  }
  .create-btn:active { transform: scale(0.9); }

  /* --- Modals (Bottom Sheets) --- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    z-index: 2500; display: none; align-items: flex-end;
  }
  .modal-sheet {
    background: #151515; width: 100%; border-top-left-radius: 25px; border-top-right-radius: 25px;
    padding: 20px; height: auto; max-height: 90vh;
    display: flex; flex-direction: column;
    animation: slideUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    border-top: 1px solid #333;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 15px; }
  .sheet-title { font-weight: 700; font-size: 1.2rem; }
  .close-btn { background: #333; color: #fff; border: none; width: 30px; height: 30px; border-radius: 50%; }

  /* Compose Styles */
  .compose-area { width: 100%; background: transparent; border: none; color: #fff; font-size: 1.2rem; min-height: 120px; resize: none; font-family: inherit; }
  
  /* Comments Styles */
  .comments-list { flex: 1; overflow-y: auto; margin-bottom: 15px; min-height: 200px; }
  .comment-item { background: #0a0a0a; padding: 12px; border-radius: 12px; margin-bottom: 10px; font-size: 0.95rem; }
  .comment-input-wrap { display: flex; gap: 10px; }
  .comment-input { flex: 1; background: #222; border: none; padding: 12px; border-radius: 20px; color: #fff; font-family: inherit; }

  /* Profile Styles */
  .profile-field { margin-bottom: 15px; }
  .profile-field label { display: block; color: #888; margin-bottom: 5px; font-size: 0.9rem; }
  .profile-field input { width: 100%; background: #222; border: 1px solid #333; padding: 10px; border-radius: 8px; color: #fff; }

  /* Toast Notification */
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
    background: #222; color: #fff; padding: 10px 20px; border-radius: 30px;
    border: 1px solid var(--accent-primary); z-index: 3000; transition: 0.3s;
    display: flex; align-items: center; gap: 8px; font-weight: 600;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Search Styles */
  .search-bar { width: 100%; background: #222; border: 1px solid #333; padding: 12px; border-radius: 12px; color: #fff; font-family: inherit; margin-bottom: 15px; }

</style>
</head>
<body>

<!-- Login Screen -->
<div id="login-screen">
  <div class="login-box">
    <div class="neon-title">NeoFlow</div>
    <p style="color:#888;">منصة الجيل الجديد</p>
    <input type="text" id="username" class="input-field" placeholder="اسم المستخدم" autocomplete="off">
    <div class="gender-select">
      <div class="g-opt selected" onclick="selGender('male', this)">ذكر</div>
      <div class="g-opt" onclick="selGender('female', this)">أنثى</div>
    </div>
    <button class="btn-main" onclick="registerUser()">دخول النظام</button>
  </div>
</div>

<!-- Main App -->
<div id="app" style="display:none;">
  
  <header class="app-header">
    <div class="user-badge" onclick="openProfile()">
      <div class="avatar-ph" id="my-avatar">U</div>
      <span style="font-size:0.9rem; font-weight:600;">ملفي</span>
    </div>
    <div class="header-brand">Neo<span style="color:var(--accent-primary)">Flow</span></div>
    <div style="width:40px; display:flex; justify-content:flex-end;" onclick="openSearch()">
        <i class="fa-solid fa-magnifying-glass" style="font-size:1.2rem; cursor:pointer;"></i>
    </div>
  </header>

  <div class="feed" id="feed-container">
    <div style="text-align:center; padding:20px; color:#555;">جارِ تحميل الشرارات...</div>
  </div>

  <!-- Dock & FAB -->
  <div class="dock-container">
    <div class="nav-dock">
      <button class="nav-item active"><i class="fa-solid fa-house"></i></button>
      <div style="width:50px;"></div> <!-- Spacer for FAB -->
      <button class="nav-item"><i class="fa-solid fa-bell"></i></button>
    </div>
    
    <div class="fab-wrapper">
      <button class="create-btn" onclick="openCompose()">
        <i class="fa-solid fa-bolt"></i>
      </button>
    </div>
  </div>

</div>

<!-- Modals -->

<!-- Compose Modal -->
<div class="modal-overlay" id="compose-modal">
  <div class="modal-sheet">
    <div class="sheet-head">
      <button class="close-btn" onclick="closeModal('compose-modal')">×</button>
      <span class="sheet-title">شرارة جديدة</span>
      <button onclick="publishPost()" style="background:var(--accent-primary); border:none; padding:5px 15px; border-radius:15px; font-weight:bold;">نشر</button>
    </div>
    <textarea id="post-text" class="compose-area" placeholder="أطلق أفكارك للعالم..."></textarea>
  </div>
</div>

<!-- Comments (Echo) Modal -->
<div class="modal-overlay" id="comments-modal">
  <div class="modal-sheet" style="height: 70vh;">
    <div class="sheet-head">
      <span class="sheet-title">الأصداء (التعليقات)</span>
      <button class="close-btn" onclick="closeModal('comments-modal')">×</button>
    </div>
    <div id="comments-list" class="comments-list">
      <!-- Comments inject here -->
    </div>
    <div class="comment-input-wrap">
      <input type="text" id="comment-text" class="comment-input" placeholder="أضف صداك..." autocomplete="off">
      <button onclick="submitComment()" style="background:var(--accent-primary); border:none; width:45px; border-radius:15px;"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>
</div>

<!-- Profile Modal -->
<div class="modal-overlay" id="profile-modal">
  <div class="modal-sheet">
    <div class="sheet-head">
      <span class="sheet-title">تعديل الملف الشخصي</span>
      <button class="close-btn" onclick="closeModal('profile-modal')">×</button>
    </div>
    <div class="profile-field">
      <label>اسم المستخدم</label>
      <input type="text" id="edit-name">
    </div>
    <div class="profile-field">
      <label>النبذة (Bio)</label>
      <input type="text" id="edit-bio" placeholder="اكتب شيئاً عنك...">
    </div>
    <button onclick="saveProfile()" class="btn-main">حفظ التغييرات</button>
  </div>
</div>

<!-- Search Modal -->
<div class="modal-overlay" id="search-modal">
  <div class="modal-sheet" style="height:80vh;">
    <div class="sheet-head">
      <span class="sheet-title">البحث</span>
      <button class="close-btn" onclick="closeModal('search-modal')">×</button>
    </div>
    <input type="text" id="search-input" class="search-bar" placeholder="ابحث عن شرارة أو مستخدم..." onkeyup="performSearch()">
    <div id="search-results" class="feed" style="padding:0;"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast">
  <i class="fa-solid fa-check-circle" style="color:var(--accent-primary)"></i>
  <span id="toast-msg">تم بنجاح</span>
</div>

<!-- Scripts -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
  // --- Firebase Init ---
  const firebaseConfig = {
    apiKey: "AIzaSyAjE-2q6PONBkCin9ZN22gDp9Q8pAH9ZW8",
    authDomain: "story-97cf7.firebaseapp.com",
    databaseURL: "https://story-97cf7-default-rtdb.firebaseio.com",
    projectId: "story-97cf7",
    storageBucket: "story-97cf7.firebasestorage.app",
    messagingSenderId: "742801388214",
    appId: "1:742801388214:web:32a305a8057b0582c5ec17",
    measurementId: "G-9DPPWX7CF0"
  };
  
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // --- Global State ---
  let currentUser = null;
  let selectedGender = 'male';
  let currentPostIdForComments = null;
  let allPostsCache = []; // للبحث

  // --- Auth Functions ---
  function init() {
    const uid = localStorage.getItem('neoflow_uid');
    if(uid) {
      db.ref('users/' + uid).once('value', snap => {
        if(snap.exists()) {
          currentUser = { uid, ...snap.val() };
          document.getElementById('login-screen').style.display = 'none';
          document.getElementById('app').style.display = 'block';
          updateUI();
          loadFeed();
        } else {
          document.getElementById('login-screen').style.display = 'flex';
        }
      });
    } else {
      document.getElementById('login-screen').style.display = 'flex';
    }
  }

  function selGender(val, el) {
    document.querySelectorAll('.g-opt').forEach(e => e.classList.remove('selected'));
    el.classList.add('selected');
    selectedGender = val;
  }

  function registerUser() {
    const name = document.getElementById('username').value.trim();
    if(!name) return showToast("أدخل الاسم أولاً");

    const newRef = db.ref('users').push();
    const uid = newRef.key;
    const userData = {
      name: name,
      gender: selectedGender,
      bio: "مستخدم جديد في نيو فلو",
      joined: Date.now()
    };
    
    newRef.set(userData).then(() => {
      localStorage.setItem('neoflow_uid', uid);
      currentUser = { uid, ...userData };
      location.reload();
    });
  }

  function updateUI() {
    const avatar = document.getElementById('my-avatar');
    avatar.innerText = currentUser.name[0].toUpperCase();
    avatar.style.color = currentUser.gender === 'male' ? '#00f2ea' : '#ff0050';
  }

  // --- Feed Functions ---
  function loadFeed() {
    const container = document.getElementById('feed-container');
    db.ref('posts').limitToLast(50).on('value', snap => {
      container.innerHTML = '';
      allPostsCache = [];
      const posts = [];
      snap.forEach(child => {
        posts.push({ id: child.key, ...child.val() });
      });
      
      // ترتيب: الأحدث أولاً
      posts.reverse().forEach(post => {
        allPostsCache.push(post);
        container.appendChild(createCard(post));
      });
      
      if(posts.length === 0) container.innerHTML = '<div style="text-align:center; margin-top:50px; color:#555;">لا توجد شرارات بعد. كن الأول!</div>';
    });
  }

  function createCard(data) {
    const div = document.createElement('div');
    div.className = 'spark-card';
    const isVibed = data.likes && data.likes[currentUser.uid];
    const vibeCount = data.likes ? Object.keys(data.likes).length : 0;
    const accent = data.gender === 'male' ? '#00f2ea' : '#ff0050';

    div.innerHTML = `
      <div class="card-top">
        <div class="user-info">
          <div class="u-avatar" style="color:${accent}; border:1px solid ${accent}40;">${data.name[0].toUpperCase()}</div>
          <div class="u-names">
            <h4>${escapeHtml(data.name)}</h4>
            <span>${timeAgo(data.timestamp)}</span>
          </div>
        </div>
      </div>
      <div class="spark-text">${escapeHtml(data.text)}</div>
      <div class="actions-bar">
        <button class="act-btn echo" onclick="openComments('${data.id}')">
          <i class="fa-regular fa-comment-dots"></i> <span>${data.commentCount || 0}</span>
        </button>
        <button class="act-btn boost" onclick="toggleBoost(this)">
          <i class="fa-solid fa-retweet"></i>
        </button>
        <button class="act-btn vibe ${isVibed ? 'active' : ''}" onclick="toggleVibe('${data.id}', this)">
          <i class="fa-solid fa-bolt"></i> <span class="vcount">${vibeCount}</span>
        </button>
      </div>
    `;
    return div;
  }

  // --- Interactions ---
  function toggleVibe(postId, btn) {
    const ref = db.ref(`posts/${postId}/likes/${currentUser.uid}`);
    ref.once('value', snap => {
      if(snap.exists()) {
        ref.remove();
      } else {
        ref.set(true);
        if(navigator.vibrate) navigator.vibrate(50); // Haptic
      }
    });
  }

  function toggleBoost(btn) {
    // محاكاة فقط للواجهة (لأن Boost يحتاج منطق معقد لإعادة النشر)
    btn.classList.toggle('active');
    if(btn.classList.contains('active')) {
       showToast("تم تعزيز الشرارة!");
       if(navigator.vibrate) navigator.vibrate(50);
    }
  }

  // --- Comments Logic ---
  function openComments(postId) {
    currentPostIdForComments = postId;
    document.getElementById('comments-modal').style.display = 'flex';
    const list = document.getElementById('comments-list');
    list.innerHTML = '<div style="text-align:center; padding:10px; color:#666;">تحميل...</div>';
    
    db.ref(`comments/${postId}`).on('value', snap => {
      list.innerHTML = '';
      if(!snap.exists()) {
        list.innerHTML = '<div style="text-align:center; padding:20px; color:#555;">كن أول من يضيف صدى!</div>';
        return;
      }
      snap.forEach(c => {
        const val = c.val();
        const item = document.createElement('div');
        item.className = 'comment-item';
        item.innerHTML = `<strong style="color:${val.gender === 'male' ? '#00f2ea':'#ff0050'}">${escapeHtml(val.name)}</strong>: ${escapeHtml(val.text)}`;
        list.appendChild(item);
      });
      // Scroll to bottom
      list.scrollTop = list.scrollHeight;
    });
  }

  function submitComment() {
    const txt = document.getElementById('comment-text').value.trim();
    if(!txt || !currentPostIdForComments) return;
    
    const comment = {
      text: txt,
      name: currentUser.name,
      gender: currentUser.gender,
      uid: currentUser.uid,
      timestamp: Date.now()
    };
    
    db.ref(`comments/${currentPostIdForComments}`).push(comment);
    // Update count on post
    db.ref(`posts/${currentPostIdForComments}/commentCount`).transaction(cnt => (cnt || 0) + 1);
    
    document.getElementById('comment-text').value = '';
  }

  // --- Publishing ---
  function openCompose() {
    document.getElementById('compose-modal').style.display = 'flex';
    setTimeout(() => document.getElementById('post-text').focus(), 100);
  }

  function publishPost() {
    const txt = document.getElementById('post-text').value.trim();
    if(!txt) return;
    
    const newPost = {
      text: txt,
      name: currentUser.name,
      gender: currentUser.gender,
      uid: currentUser.uid,
      timestamp: firebase.database.ServerValue.TIMESTAMP,
      commentCount: 0
    };
    
    db.ref('posts').push(newPost).then(() => {
      document.getElementById('post-text').value = '';
      closeModal('compose-modal');
      showToast('تم إطلاق الشرارة!');
    });
  }

  // --- Profile ---
  function openProfile() {
    document.getElementById('edit-name').value = currentUser.name;
    document.getElementById('edit-bio').value = currentUser.bio || '';
    document.getElementById('profile-modal').style.display = 'flex';
  }

  function saveProfile() {
    const newName = document.getElementById('edit-name').value.trim();
    const newBio = document.getElementById('edit-bio').value.trim();
    if(!newName) return;
    
    db.ref(`users/${currentUser.uid}`).update({
      name: newName,
      bio: newBio
    }).then(() => {
      currentUser.name = newName;
      currentUser.bio = newBio;
      updateUI();
      closeModal('profile-modal');
      showToast('تم حفظ الملف الشخصي');
    });
  }

  // --- Search ---
  function openSearch() {
    document.getElementById('search-modal').style.display = 'flex';
    document.getElementById('search-input').focus();
    performSearch(); // Show all initially or clear
  }

  function performSearch() {
    const query = document.getElementById('search-input').value.toLowerCase();
    const resultsContainer = document.getElementById('search-results');
    resultsContainer.innerHTML = '';

    const filtered = allPostsCache.filter(p => 
      (p.text && p.text.toLowerCase().includes(query)) || 
      (p.name && p.name.toLowerCase().includes(query))
    );

    if(filtered.length === 0) {
      resultsContainer.innerHTML = '<div style="text-align:center; padding:20px; color:#555;">لا توجد نتائج</div>';
      return;
    }

    filtered.forEach(post => {
      resultsContainer.appendChild(createCard(post));
    });
  }

  // --- Helpers ---
  function closeModal(id) {
    document.getElementById(id).style.display = 'none';
    // Clear listeners if needed specifically for comments to save bandwidth
    if(id === 'comments-modal' && currentPostIdForComments) {
       db.ref(`comments/${currentPostIdForComments}`).off();
       currentPostIdForComments = null;
    }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    document.getElementById('toast-msg').innerText = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  function escapeHtml(text) {
    if(!text) return "";
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }

  function timeAgo(ts) {
    const seconds = Math.floor((Date.now() - ts) / 1000);
    if (seconds < 60) return "الآن";
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes}د`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `${hours}س`;
    return `${Math.floor(hours / 24)}ي`;
  }

  // --- Start ---
  window.onload = init;

</script>
</body>
</html>
